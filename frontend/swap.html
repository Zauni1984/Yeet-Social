<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="meta.title">NOTE → YEET Swap</title>
<meta name="description" data-i18n-content="meta.desc" content="Official NOTE→YEET swap by Yeet Social. Rate 100 NOTE = 1 YEET. Start will be announced.">
<style>
:root{
  --bg:#0a0a0a; --bg-2:#0d0d0d; --card:#111; --card-2:#1a1a1a;
  --border:#222; --border-2:#333; --text:#e8e8e8; --muted:#8a8f7f; --dim:#555;
  --accent:#c6f135; --accent-rgb:198,241,53; --on-accent:#000;
  --warn:#f5a623; --warn-rgb:245,166,35;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 800px at 50% -10%,#13150b 0%,var(--bg) 60%);background-attachment:fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 64px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--border);margin-bottom:36px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;color:var(--text);text-decoration:none}
.logo .dot{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:15px}
.lang select{background:var(--card-2);border:1px solid var(--border-2);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}
h1{font-size:clamp(28px,6vw,40px);line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
h1 .n{color:#6ba8ff}
h1 .y{color:var(--accent)}
.sub{color:var(--muted);font-size:16px;margin:0 0 28px;max-width:56ch}
.banner{display:flex;gap:12px;align-items:flex-start;background:rgba(var(--warn-rgb),.08);border:1px solid rgba(var(--warn-rgb),.35);border-radius:14px;padding:16px 18px;margin-bottom:32px}
.banner .ico{font-size:20px;line-height:1.3}
.banner b{color:var(--warn)}
.banner p{margin:4px 0 0;font-size:14px;color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:20px}
.rate{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;font-weight:900;font-size:clamp(20px,4.5vw,28px);padding:8px 0 14px}
.rate .chip{background:var(--card-2);border:1px solid var(--border-2);border-radius:14px;padding:10px 18px}
.rate .arrow{color:var(--accent);font-size:26px}
.rate small{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.calc{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.calc .f{flex:1;min-width:200px}
.calc label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.calc input{width:100%;background:var(--bg-2);border:1px solid var(--border-2);border-radius:12px;padding:12px 14px;color:var(--text);font-size:18px;font-weight:700;outline:none}
.calc input:focus{border-color:var(--accent)}
.calc input[readonly]{color:var(--accent)}
.swapbtn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:var(--card-2);color:var(--dim);font-weight:900;font-size:16px;cursor:not-allowed;letter-spacing:.02em}
.swapnote{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
h2{font-size:18px;margin:34px 0 12px}
ul.facts{list-style:none;padding:0;margin:0;display:grid;gap:10px}
ul.facts li{display:flex;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px}
ul.facts li b{color:var(--accent)}
ul.facts .fi{color:var(--accent);flex:none}
ol.steps{padding-left:0;list-style:none;counter-reset:s;display:grid;gap:12px;margin:0}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px 14px 54px;position:relative;font-size:14px}
ol.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px}
ol.steps b{display:block;margin-bottom:2px}
details{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 16px;margin-bottom:10px}
details summary{cursor:pointer;font-weight:700;font-size:14px;padding:13px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::after{content:'+';color:var(--accent);font-size:18px;font-weight:900}
details[open] summary::after{content:'–'}
details p{margin:0 0 14px;font-size:14px;color:var(--muted)}
footer{border-top:1px solid var(--border);margin-top:44px;padding-top:18px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="https://justyeet.it/"><span class="dot">Y</span> YEET</a>
    <div class="lang"><select id="langSel" aria-label="Language" data-i18n-aria="lang.label" onchange="setL(this.value)"></select></div>
  </header>

  <h1><span class="n">NOTE</span> → <span class="y">YEET</span> Swap</h1>
  <p class="sub" data-i18n="sub"></p>

  <div class="banner">
    <span class="ico">🔒</span>
    <div>
      <b data-i18n="banner.title"></b>
      <p data-i18n-html="banner.text"></p>
    </div>
  </div>

  <div class="card">
    <div class="rate">
      <span class="chip">100 NOTE<small data-i18n="rate.give"></small></span>
      <span class="arrow">→</span>
      <span class="chip" style="border-color:rgba(var(--accent-rgb),.5)">1 YEET<small data-i18n="rate.get"></small></span>
    </div>
    <div class="calc">
      <div class="f">
        <label for="inNote">NOTE</label>
        <input id="inNote" type="number" min="0" step="1" data-i18n-placeholder="calc.placeholder" oninput="calc()">
      </div>
      <div class="f">
        <label for="outYeet">YEET</label>
        <input id="outYeet" readonly placeholder="—">
      </div>
    </div>
    <button class="swapbtn" id="swapBtn" disabled data-i18n="btn.locked"></button>
    <div class="swapnote" id="swapNote" data-i18n="note.fixed"></div>
  </div>

  <div class="card" id="swapPanel" style="display:none">
    <h2 style="margin:0 0 6px" data-i18n="panel.title"></h2>
    <div id="swapNeedLogin" style="display:none">
      <p style="color:var(--muted);font-size:14px;margin:0 0 12px" data-i18n="panel.needLogin"></p>
      <a href="https://justyeet.it/" style="display:inline-block;background:var(--accent);color:var(--on-accent);font-weight:800;padding:10px 18px;border-radius:10px;text-decoration:none" data-i18n="panel.signIn"></a>
    </div>
    <div id="swapRequest" style="display:none">
      <p style="color:var(--muted);font-size:14px;margin:0 0 12px" data-i18n="panel.requestText"></p>
      <button id="btnAddr" onclick="requestAddress()" style="width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:16px;cursor:pointer" data-i18n="btn.request"></button>
    </div>
    <div id="swapAddr" style="display:none">
      <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px" data-i18n="panel.addrLabel"></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <code id="addrText" style="flex:1;min-width:200px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:10px;padding:12px 14px;font-size:14px;word-break:break-all;color:var(--accent)"></code>
        <button onclick="copyAddr()" style="padding:12px 16px;border:1px solid var(--border-2);border-radius:10px;background:transparent;color:var(--text);cursor:pointer;font-weight:700" data-i18n="panel.copy"></button>
      </div>
      <p id="addrHint" style="color:var(--muted);font-size:13px;margin:10px 0 0"></p>
      <div id="depWrap" style="margin-top:16px"></div>
    </div>
    <p id="swapMsg" style="display:none;margin:12px 0 0;padding:10px 12px;border-radius:10px;background:rgba(var(--warn-rgb),.08);border:1px solid rgba(var(--warn-rgb),.35);color:var(--text);font-size:14px"></p>
  </div>

  <h2 data-i18n="facts.title"></h2>
  <ul class="facts">
    <li><span class="fi">◆</span><span data-i18n-html="facts.rate"></span></li>
    <li><span class="fi">◆</span><span data-i18n-html="facts.oneway"></span></li>
    <li><span class="fi">◆</span><span data-i18n-html="facts.fees"></span></li>
    <li><span class="fi">◆</span><span data-i18n-html="facts.req"></span></li>
    <li><span class="fi">◆</span><span data-i18n-html="facts.pool"></span></li>
    <li><span class="fi">◆</span><span data-i18n-html="facts.team"></span></li>
    <li><span class="fi">◆</span><span data-i18n-html="facts.nc"></span></li>
  </ul>

  <h2 data-i18n="steps.title"></h2>
  <ol class="steps">
    <li><b data-i18n-html="steps.1t"></b><span data-i18n="steps.1"></span></li>
    <li><b data-i18n-html="steps.2t"></b><span data-i18n="steps.2"></span></li>
    <li><b data-i18n-html="steps.3t"></b><span data-i18n-html="steps.3"></span></li>
  </ol>

  <h2>FAQ</h2>
  <details><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details>
  <details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details>
  <details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details>
  <details><summary data-i18n="faq.q4"></summary><p data-i18n="faq.a4"></p></details>
  <details><summary data-i18n="faq.q5"></summary><p data-i18n-html="faq.a5"></p></details>

  <footer>
    <span>© Yeet Social · <a href="https://justyeet.it/">justyeet.it</a></span>
    <span data-i18n="footer.disclaimer"></span>
  </footer>
</div>

el.addrLabel":"Deine NOTE-Einzahladresse","panel.copy":"Kopieren","hint.addr":"Kurs 100 NOTE = 1 YEET · Gutschrift nach {n} Bestätigungen (~{m} Min.)","hint.min":" · Mindestbetrag {n} NOTE","facts.title":"Die Eckdaten","facts.rate":"<b>Kurs fix:<\/b> 100 NOTE = 1 YEET. Der Kurs ist festgelegt und ändert sich nicht.","facts.oneway":"<b>Einbahnstraße:<\/b> Der Swap läuft nur NOTE → YEET. Ein Rücktausch ist ausgeschlossen.","facts.fees":"<b>Gebühren:<\/b> Yeet erhebt keine Swap-Gebühr. Netzwerkgebühren (NOTE-Transaktionsgebühr, später BNB-Gas für Transfers, Richtwert ~0,01 BNB) trägst du selbst.","facts.req":"<b>Voraussetzungen:<\/b> Yeet-Konto auf justyeet.it mit abgeschlossener Verifizierung (KYC) und einer verknüpften, eigenen BSC-Wallet (z. B. MetaMask).","facts.pool":"<b>Swap-Pool:<\/b> maximal 500.000.000 YEET (aus dem Community-Pool der fest begrenzten 21 Mrd. Gesamtmenge) — genug selbst dann, wenn alle NOTE getauscht werden.","facts.team":"<b>Team-Coins ausgeschlossen:<\/b> Das Yeet-Team verzichtet auf seine früher geminten NOTE — sie sind vom Swap ausgeschlossen.","facts.nc":"<b>Non-custodial:<\/b> YEET landet direkt in deiner eigenen Wallet. Yeet verwahrt niemals Token für dich.","steps.title":"So wird der Swap ablaufen","steps.1t":"Anmelden &amp; verknüpfen","steps.1":"Melde dich auf justyeet.it an, schließe die Verifizierung (KYC) ab und verknüpfe deine BSC-Wallet über den signierten Wallet-Login.","steps.2t":"Persönliche NOTE-Einzahladresse erhalten","steps.2":"Auf dieser Seite bekommst du nach dem Start eine Einzahladresse auf der Note-Blockchain, die nur dir zugeordnet ist.","steps.3t":"NOTE senden — YEET erhalten","steps.3":"Sende NOTE aus deiner eigenen Wallet an deine Einzahladresse. Nach <span class=\"confN\">ausreichend<\/span> Bestätigungen auf der Note-Chain wird dir automatisch 1 YEET je 100 NOTE auf deine verknüpfte BSC-Wallet ausgezahlt. Jede Auszahlung ist im öffentlichen Explorer nachvollziehbar.","faq.q1":"Wann startet der Swap?","faq.a1":"S ool totale è limitato a 500 milioni di YEET.","faq.q5":"Ma cos'è YEET?","faq.a5":"YEET è il token di utilità della piattaforma social <a href=\"https://justyeet.it/\">justyeet.it<\/a> (BEP-20 su BNB Smart Chain, fornitura totale fissa di 21 miliardi). Sulla piattaforma guadagni punti (post, ricompense, mance) e li converti a senso unico in YEET.","footer.disclaimer":"Non è un'offerta né una consulenza in materia di investimenti. Le cripto-attività possono perdere valore.","msg.locked":"Lo swap è ancora bloccato — l'inizio sarà annunciato.","msg.kyc":"Completa prima la verifica (KYC) nelle impostazioni di Yeet.","msg.wallet":"Collega prima il tuo wallet BSC nelle impostazioni di Yeet (destinazione del pagamento).","msg.error":"Errore: {code}","msg.network":"Errore di rete — riprova più tardi.","msg.copied":"Indirizzo copiato.","dep.none":"Nessun deposito rilevato finora.","dep.title":"I tuoi depositi","dep.conf":"Conf.","dep.status":"Stato","dep.credited":"accreditato","dep.failed":"fallito","dep.pending":"in attesa","lang.label":"Lingua"},"fr":{"meta.title":"Swap NOTE → YEET","meta.desc":"Swap officiel NOTE→YEET par Yeet Social. Taux 100 NOTE = 1 YEET. Le lancement sera annoncé.","sub":"L'échange officiel des coins de la blockchain Note contre le token utilitaire YEET (BEP-20, BNB Smart Chain) — directement ici, chez Yeet Social.","banner.title":"Le swap n'a pas encore commencé.","banner.text":"Le smart contract est en préparation. Dès que le swap sera en ligne, nous annoncerons le lancement partout — sur justyeet.it, dans l'app et sur tous nos canaux. D'ici là, les swaps sont verrouillés. <strong>N'envoie encore aucun coin NOTE à quelque adresse que ce soit !<\/strong>","rate.give":"tu donnes","rate.get":"tu reçois","calc.placeholder":"ex. 250000","btn.locked":"🔒 Swap verrouillé — le lancement sera annoncé","btn.request":"Demander une adresse de dépôt","note.fixed":"Taux fixe 100:1 · aucuns frais Yeet sur le swap · les frais de réseau sont à ta charge","note.pool": der valor.","msg.locked":"O swap ainda está bloqueado — o início será anunciado.","msg.kyc":"Conclua primeiro a verificação (KYC) nas suas configurações da Yeet.","msg.wallet":"Vincule primeiro sua carteira BSC nas suas configurações da Yeet (destino do pagamento).","msg.error":"Erro: {code}","msg.network":"Erro de rede — tente novamente mais tarde.","msg.copied":"Endereço copiado.","dep.none":"Nenhum depósito detectado ainda.","dep.title":"Seus depósitos","dep.conf":"Conf.","dep.status":"Status","dep.credited":"creditado","dep.failed":"falhou","dep.pending":"pendente","lang.label":"Idioma"},"fi":{"meta.title":"NOTE → YEET Swap","meta.desc":"Virallinen NOTE→YEET-swap, jonka toteuttaa Yeet Social. Kurssi 100 NOTE = 1 YEET. Aloitus ilmoitetaan erikseen.","sub":"Note-lohkoketjun kolikoiden virallinen vaihto YEET-hyötytokeniin (BEP-20, BNB Smart Chain) — suoraan täällä Yeet Socialissa.","banner.title":"Swap ei ole vielä alkanut.","banner.text":"Älysopimus on valmisteilla. Kun swap käynnistyy, ilmoitamme aloituksesta kaikkialla — justyeet.it-sivustolla, sovelluksessa ja kaikilla kanavilla. Siihen asti swapit ovat lukittuina. <strong>Älä lähetä NOTE-kolikoita vielä mihinkään osoitteeseen!<\/strong>","rate.give":"annat","rate.get":"saat","calc.placeholder":"esim. 250000","btn.locked":"🔒 Swap lukittu — aloitus ilmoitetaan","btn.request":"Pyydä talletusosoite","note.fixed":"Kiinteä kurssi 100:1 · ei Yeet-maksua swapista · verkkomaksut maksat itse","note.pool":"poolista käytetty","panel.title":"Sinun swapisi","panel.needLogin":"Kirjaudu ensin Yeetiin (samassa selaimessa), sitten voit pyytää täältä henkilökohtaisen NOTE-talletusosoitteesi.","panel.signIn":"Kirjaudu Yeetiin","panel.requestText":"Saat talletusosoitteen, joka on yhdistetty vain sinuun. Lähetä sinne NOTE-kolikoita vain omasta lompakostasi.","panel.addrLabel":"NOTE-talletusosoitteesi","panel.copy":"Kopioi","hint.addr":"Kurssi 100 NOTE = 1 YEET · hyvitetään {n} vahvistuksen jälkeen (~{m} min)","hint.min":" · vähimmäismäärä {n} NOTE","facts.title":"Keskeiset faktat","facts.rate":"<b>Kiinteä kurssi:<\/b> 100 NOTE = 1 YEET. Kurssi on kiinteä eikä muutu.","facts.oneway":"<b>Yksisuuntainen:<\/b> Swap toimii vain suuntaan NOTE → YEET. Paluutietä ei ole.","facts.fees":"<b>Maksut:<\/b> Yeet ei peri swap-maksua. Verkkomaksut (NOTE-siirtomaksu, myöhemmin BNB-gas siirroista, suuruusluokkaa ~0,01 BNB) maksat itse.","facts.req":"<b>Vaatimukset:<\/b> Yeet-tili justyeet.it-sivustolla, suoritettu tunnistautuminen (KYC) ja oma yhdistetty BSC-lompakko (esim. MetaMask).","facts.pool":"<b>Swap-pooli:<\/b> enintään 500 000 000 YEET (kiinteän 21 mrd:n kokonaismäärän yhteisöpoolista) — riittää, vaikka jokainen NOTE vaihdettaisiin.","facts.team":"<b>Tiimin kolikot poissuljettu:<\/b> Yeet-tiimi luopuu aiemmin louhimistaan NOTE-kolikoista — ne on suljettu swapin ulkopuolelle.","facts.nc":"<b>Non-custodial (ei säilytystä):<\/b> YEET menee suoraan omaan lompakkoosi. Yeet ei koskaan säilytä tokeneita puolestasi.","steps.title":"Näin swap tulee toimimaan","steps.1t":"Kirjaudu &amp; yhdistä","steps.1":"Kirjaudu justyeet.it-sivustolle, suorita tunnistautuminen (KYC) ja yhdistä BSC-lompakkosi allekirjoitetun lompakkokirjautumisen kautta.","steps.2t":"Hanki henkilökohtainen NOTE-talletusosoitteesi","steps.2":"Käynnistyksen jälkeen saat tältä sivulta Note-lohkoketjun talletusosoitteen, joka on yhdistetty vain sinuun.","steps.3t":"Lähetä NOTE — saat YEET","steps.3":"Lähetä NOTE omasta lompakostasi talletusosoitteeseesi. Kun Note-ketjussa on <span class=\"confN\">riittävästi<\/span> vahvistuksia, 1 YEET per 100 NOTE maksetaan automaattisesti yhdistettyyn BSC-lompakkoosi. Jokainen maksu on jäljitettävissä julkisessa explorerissa.","faq.q1":"Milloin swap alkaa?","faq.a1":"Heti kun YEET-älysopimus on valmis ja tarkastettu. Ilmoitamme aloituspäivän kaikkialla — hiljaista käynnistystä ei tule. Siihen asti: älä lähetä NOTE-kolikoita kenellekään, joka lupaa ”swapin”.","faq.q2":"Mitä talletetuille NOTE-kolikoille tapahtuu?","faq.a2":"Talletetut NOTE poistetaan pysyvästi kierrosta ja säilytetään julkisesti nähtävissä olevassa osoitteessa — ne eivät koskaan palaa kiertoon.","faq.q3":"Miksi tarvitsen KYC:n ja oman lompakon?","faq.a3":"Yeet on non-custodial: emme koskaan säilytä tokeneita puolestasi, joten tarvitset oman BSC-lompakon maksun kohteeksi. Tunnistautuminen vaaditaan kaikissa Yeet-palveluissa, ja se suojaa swapia väärinkäytöltä.","faq.q4":"Onko vähimmäis- tai enimmäismäärää?","faq.a4":"Yksityiskohdat, kuten vähimmäismäärä ja vahvistusten lukumäärä, julkaistaan aloitusilmoituksen yhteydessä. Kokonaispooli on rajattu 500 milj. YEETiin.","faq.q5":"Mikä YEET oikeastaan on?","faq.a5":"YEET on sosiaalisen alustan <a href=\"https://justyeet.it/\">justyeet.it<\/a> hyötytoken (BEP-20 BNB Smart Chainissa, kiinteä kokonaismäärä 21 mrd). Alustalla ansaitset pisteitä (postaukset, palkkiot, tipit) ja muunnat ne yksisuuntaisesti YEETiksi.","footer.disclaimer":"Ei tarjous, ei sijoitusneuvontaa. Kryptovarat voivat menettää arvoaan.","msg.locked":"Swap on vielä lukittu — aloitus ilmoitetaan.","msg.kyc":"Suorita ensin tunnistautuminen (KYC) Yeet-asetuksissasi.","msg.wallet":"Yhdistä ensin BSC-lompakkosi Yeet-asetuksissasi (maksun kohde).","msg.error":"Virhe: {code}","msg.network":"Verkkovirhe — yritä myöhemmin uudelleen.","msg.copied":"Osoite kopioitu.","dep.none":"Talletuksia ei ole vielä havaittu.","dep.title":"Talletuksesi","dep.conf":"Vahv.","dep.status":"Tila","dep.credited":"hyvitetty","dep.failed":"epäonnistui","dep.pending":"odottaa","lang.label":"Kieli"},"sv":{"meta.title":"NOTE → YEET Swap","meta.desc":"Officiell NOTE→YEET-swap från Yeet Social. Kurs 100 NOTE = 1 YEET. Starten meddelas.","sub":"Det officiella bytet av Note-blockkedjans coins till YEET-nyttotoken (BEP-20, BNB Smart Chain) — direkt här hos Yeet Social.","banner.title":"Swappen har inte startat ännu.","banner.text":"Det smarta kontraktet förbereds. När swappen går live meddelar vi starten överallt — på justyeet.it, i appen och i alla kanaler. Fram till dess är swappar låsta. <strong>Skicka inga NOTE-coins till någon adress ännu!<\/strong>","rate.give":"du ger","rate.get":"du får","calc.placeholder":"t.ex. 250000","btn.locked":"🔒 Swap låst — starten meddelas","btn.request":"Begär insättningsadress","note.fixed":"Fast kurs 100:1 · ingen Yeet-avgift på swappen · nätverksavgifter står du för själv","note.pool":"pool använd","panel.title":"Din swap","panel.needLogin":"Logga in på Yeet först (samma webbläsare), begär sedan din personliga NOTE-insättningsadress här.","panel.signIn":"Logga in på Yeet","panel.requestText":"Du får en insättningsadress som är kopplad enbart till dig. Skicka NOTE dit endast från din egen plånbok.","panel.addrLabel":"Din NOTE-insättningsadress","panel.copy":"Kopiera","hint.addr":"Kurs 100 NOTE = 1 YEET · krediteras efter {n} bekräftelser (~{m} min)","hint.min":" · minst {n} NOTE","facts.title":"Viktiga fakta","facts.rate":"<b>Fast kurs:<\/b> 100 NOTE = 1 YEET. Kursen är fast och ändras inte.","facts.oneway":"<b>Enkelriktat:<\/b> Swappen går bara NOTE → YEET. Det finns ingen väg tillbaka.","facts.fees":"<b>Avgifter:<\/b> Yeet tar ingen swapavgift. Nätverksavgifter (NOTE-transaktionsavgift, senare BNB-gas för överföringar, ungefär ~0,01 BNB) står du för själv.","facts.req":"<b>Krav:<\/b> ett Yeet-konto på justyeet.it med slutförd verifiering (KYC) och en egen kopplad BSC-plånbok (t.ex. MetaMask).","facts.pool":"<b>Swap-pool:<\/b> begränsad till 500 000 000 YEET (från community-poolen av den fasta totala mängden på 21 miljarder) — tillräckligt även om varenda NOTE swappas.","facts.team":"<b>Teamets coins undantagna:<\/b> Yeet-teamet avstår från sina tidigare minade NOTE — de är undantagna från swappen.","facts.nc":"<b>Non-custodial:<\/b> YEET går direkt till din egen plånbok. Yeet förvarar aldrig tokens åt dig.","steps.title":"Så kommer swappen att fungera","steps.1t":"Registrera dig &amp; koppla","steps.1":"Logga in på justyeet.it, slutför verifieringen (KYC) och koppla din BSC-plånbok via den signerade plånboksinloggningen.","steps.2t":"Hämta din personliga NOTE-insättningsadress","steps.2":"Efter starten får du på den här sidan en insättningsadress på Note-blockkedjan som är kopplad enbart till dig.","steps.3t":"Skicka NOTE — få YEET","steps.3":"Skicka NOTE från din egen plånbok till din insättningsadress. Efter <span class=\"confN\">tillräckligt många<\/span> bekräftelser på Note-kedjan betalas 1 YEET per 100 NOTE automatiskt ut till din kopplade BSC-plånbok. Varje utbetalning går att spåra i den publika explorern.","faq.q1":"När startar swappen?","faq.a1":"Så snart YEET-smartkontraktet är färdigt och granskat. Vi meddelar startdatumet överallt — det blir ingen tyst lansering. Fram till dess: skicka inte NOTE till någon som utlovar en ”swap”.","faq.q2":"Vad händer med de insatta NOTE?","faq.a2":"Insatta NOTE tas permanent ur cirkulation och hålls på en offentligt synlig adress — de kommer aldrig tillbaka i omlopp.","faq.q3":"Varför behöver jag KYC och en egen plånbok?","faq.a3":"Yeet är non-custodial: vi förvarar aldrig tokens åt dig, därför behöver du en egen BSC-plånbok som utbetalningsmål. Verifiering krävs för alla Yeet-tjänster och skyddar swappen mot missbruk.","faq.q4":"Finns det ett minimum eller maximum?","faq.a4":"Detaljer som minsta belopp och antal bekräftelser publiceras tillsammans med startmeddelandet. Den totala poolen är begränsad till 500 miljoner YEET.","faq.q5":"Vad är YEET egentligen?","faq.a5":"YEET är nyttotoken för den sociala plattformen <a href=\"https://justyeet.it/\">justyeet.it<\/a> (BEP-20 på BNB Smart Chain, fast total mängd på 21 miljarder). På plattformen tjänar du poäng (inlägg, belöningar, dricks) och omvandlar dem enkelriktat till YEET.","footer.disclaimer":"Inget erbjudande, ingen investeringsrådgivning. Kryptotillgångar kan förlora i värde.","msg.locked":"Swappen är fortfarande låst — starten meddelas.","msg.kyc":"Slutför först verifieringen (KYC) i dina Yeet-inställningar.","msg.wa Yeet-tjenester og beskytter swappen mot misbruk.","faq.q4":"Finnes det et minimum eller maksimum?","faq.a4":"Detaljer som minstebeløp og antall bekreftelser publiseres sammen med startkunngjøringen. Den totale poolen er begrenset til 500 millioner YEET.","faq.q5":"Hva er egentlig YEET?","faq.a5":"YEET er nyttetokenet til den sosiale plattformen <a href=\"https://justyeet.it/\">justyeet.it<\/a> (BEP-20 på BNB Smart Chain, fast totalmengde på 21 milliarder). På plattformen tjener du poeng (innlegg, belønninger, tips) og konverterer dem énveis til YEET.","footer.disclaimer":"Ikke et tilbud, ikke investeringsråd. Kryptoaktiva kan falle i verdi.","msg.locked":"Swappen er fortsatt låst — starten blir kunngjort.","msg.kyc":"Fullfør først verifiseringen (KYC) i Yeet-innstillingene dine.","msg.wallet":"Koble først til BSC-lommeboken din i Yeet-innstillingene dine (utbetalingsmål).","msg.error":"Feil: {code}","msg.network":"Nettverksfeil — prøv igjen senere.","msg.copied":"Adresse kopiert.","dep.none":"Ingen innskudd oppdaget ennå.","dep.title":"Dine innskudd","dep.conf":"Bekr.","dep.status":"Status","dep.credited":"godskrevet","dep.failed":"mislyktes","dep.pending":"venter","lang.label":"Språk"},"is":{"meta.title":"NOTE → YEET Swap","meta.desc":"Opinber NOTE→YEET-skipti frá Yeet Social. Gengi 100 NOTE = 1 YEET. Upphaf verður tilkynnt.","sub":"Opinber skipti á mynt Note-bálkakeðjunnar yfir í YEET-nytjatókann (BEP-20, BNB Smart Chain) — beint hér hjá Yeet Social.","banner.title":"Skiptin eru ekki hafin enn.","banner.text":"Snjallsamningurinn er í undirbúningi. Um leið og skiptin fara í loftið tilkynnum við upphafið alls staðar — á justyeet.it, í appinu og á öllum rásum. Þangað til eru skipti læst. <strong>Ekki senda NOTE-mynt á neitt vistfang enn!<\/strong>","rate.give":"þú gefur","rate.get":"þú færð","calc.placeholder":"t.d. 250000","btn.locked":"🔒 Skipti læst — upphaf verður tilkynnt","btn.request":"Biðja um innlagnarvistfang","note.fixed":"Fast gengi 100:1 · ekkert Yeet-gjald af skiptunum · netgjöld eru á þinn kostnað","note.pool":"nýtt af potti","panel.title":"Þín skipti","panel.needLogin":"Skráðu þig fyrst inn á Yeet (í sama vafra) og biddu svo hér um þitt persónulega NOTE-innlagnarvistfang.","panel.signIn":"Skrá inn á Yeet","panel.requestText":"Þú færð innlagnarvistfang sem er eingöngu tengt þér. Sendu NOTE þangað eingöngu úr þínu eigin veski.","panel.addrLabel":"NOTE-innlagnarvistfangið þitt","panel.copy":"Afrita","hint.addr":"Gengi 100 NOTE = 1 YEET · fært inn eftir {n} staðfestingar (~{m} mín.)","hint.min":" · lágmark {n} NOTE","facts.title":"Helstu staðreyndir","facts.rate":"<b>Fast gengi:<\/b> 100 NOTE = 1 YEET. Gengið er fast og breytist ekki.","facts.oneway":"<b>Aðeins í eina átt:<\/b> Skiptin ganga aðeins NOTE → YEET. Engin leið er til baka.","facts.fees":"<b>Gjöld:<\/b> Yeet tekur ekkert skiptigjald. Netgjöld (NOTE-færslugjald, síðar BNB-gas fyrir millifærslur, u.þ.b. ~0,01 BNB) eru á þinn kostnað.","facts.req":"<b>Skilyrði:<\/b> Yeet-aðgangur á justyeet.it með lokinni auðkenningu (KYC) og þitt eigið tengt BSC-veski (t.d. MetaMask).","facts.pool":"<b>Skiptipottur:<\/b> að hámarki 500.000.000 YEET (úr samfélagspotti fasts heildarmagns upp á 21 milljarð) — nóg jafnvel þótt hverri einustu NOTE sé skipt.","facts.team":"<b>Mynt teymisins undanskilin:<\/b> Yeet-teymið afsalar sér þeirri NOTE-mynt sem það gróf áður — hún er undanskilin skiptunum.","facts.nc":"<b>Non-custodial (án vörslu):<\/b> YEET fer beint í þitt eigið veski. Yeet geymir aldrei tóka fyrir þig.","steps.title":"Svona munu skiptin virka","steps.1t":"Skráðu þig &amp; tengdu","steps.1":"Skráðu þig inn á justyeet.it, ljúktu auðkenningu (KYC) og tengdu BSC-veskið þitt með undirritaðri veskisinnskráningu.","steps.2t":"Fáðu þitt persónulega NOTE-innlagnarvistfang","steps.2":"Eftir opnun færðu á þessari síðu innlagnarvistfang á Note-bálkakeðjunni sem er eingöngu tengt þér.","steps.3t":"Sendu NOTE — fáðu YEET","steps.3":"Sendu NOTE úr þínu eigin veski á innlagnarvistfangið þitt. Eftir <span class=\"confN\">nægilega margar<\/span> staðfestingar á Note-keðjunni er 1 YEET fyrir hverjar 100 NOTE greiddur sjálfkrafa út í tengda BSC-veskið þitt. Hverja útgreiðslu má rekja í opinbera könnuðinum (explorer).","faq.q1":"Hvenær hefjast skiptin?","faq.a1":"Um leið og YEET-snjallsamningurinn er tilbúinn og yfirfarinn. Við tilkynnum upphafsdaginn alls staðar — það verður engin þögul opnun. Þangað til: ekki senda NOTE til neins sem lofar „skiptum“.","faq.q2":"Hvað verður um innlagða NOTE?","faq.a2":"Innlögð NOTE er tekin varanlega úr umferð og geymd á opinberlega sýnilegu vistfangi — hún fer aldrei aftur í umferð.","faq.q3":"Af hverju þarf ég KYC og eigið veski?","faq.a3":"Yeet er non-custodial (án vörslu): við geymum aldrei tóka fyrir þig, þess vegna þarftu þitt eigið BSC-veski sem útgreiðslustað. Auðkenning er skilyrði fyrir allri þjónustu Yeet og verndar skiptin gegn misnotkun.","faq.q4":"Er lágmark eða hámark?","faq.a4":"Upplýsingar eins og lágmarksupphæð og fjöldi staðfestinga verða birtar með upphafstilkynningunni. Heildarpotturinn er takmarkaður við 500 milljónir YEET.","faq.q5":"Hvað er YEET eiginlega?","faq.a5":"YEET er nytjatóki samfélagsmiðilsins <a href=\"https://justyeet.it/\">justyeet.it<\/a> (BEP-20 á BNB Smart Chain, fast heildarmagn 21 milljarður). Á miðlinum vinnur þú þér inn stig (færslur, verðlaun, þjórfé) og breytir þeim í eina átt yfir í YEET.","footer.disclaimer":"Ekki tilboð, ekki fjárfestingarráðgjöf. Rafmyntir og aðrar dulritunareignir geta tapað verðgildi.","msg.locked":"Skiptin eru enn læst — upphafið verður tilkynnt.","msg.kyc":"Ljúktu fyrst auðkenningu (KYC) í Yeet-stillingunum þínum.","msg.wallet":"Tengdu fyrst BSC-veskið þitt í Yeet-stillingunum þínum (útgreiðslustaður).","msg.error":"Villa: {code}","msg.network":"Netvilla — reyndu aftur síðar.","msg.copied":"Vistfang afritað.","dep.none":"Engar innlagnir fundust enn.","dep.title":"Innlagnir þínar","dep.conf":"Staðf.","dep.status":"Staða","dep.credited":"fært inn"," celkové nabídky 21 mld.) — dost i v případě, že se vymění všechny NOTE.","facts.team":"<b>Coiny týmu vyloučeny:<\/b> tým Yeet se vzdává svých dříve vytěžených NOTE — ze swapu jsou vyloučeny.","facts.nc":"<b>Non-custodial:<\/b> YEET jdou přímo do tvé vlastní peněženky. Yeet pro tebe nikdy nedrží žádné tokeny.","steps.title":"Jak bude swap probíhat","steps.1t":"Registrace &amp; propojení","steps.1":"Přihlas se na justyeet.it, dokonči ověření (KYC) a propoj svou BSC peněženku přes podepsané přihlášení peněženkou.","steps.2t":"Získej svou osobní vkladovou adresu NOTE","steps.2":"Po spuštění ti tato stránka přidělí vkladovou adresu na blockchainu Note, která je přiřazená jen tobě.","steps.3t":"Pošli NOTE — obdrž YEET","steps.3":"Pošli NOTE ze své vlastní peněženky na svou vkladovou adresu. Jakmile na řetězci Note proběhne <span class=\"confN\">dostatek<\/span> potvrzení, automaticky se ti vyplatí 1 YEET za každých 100 NOTE do tvé propojené BSC peněženky. Každá výplata je dohledatelná ve veřejném exploreru.","faq.q1":"Kdy swap začne?","faq.a1":"Jakmile bude smart contract YEET dokončený a zkontrolovaný. Datum startu oznámíme všude — žádný tichý start nebude. Do té doby: neposílej NOTE nikomu, kdo slibuje „swap“.","faq.q2":"Co se stane s vloženými NOTE?","faq.a2":"Vložené NOTE jsou trvale staženy z oběhu a drženy na veřejně dohledatelné adrese — do oběhu se už nikdy nevrátí.","faq.q3":"Proč potřebuji KYC a vlastní peněženku?","faq.a3":"Yeet je non-custodial: nikdy pro tebe nedržíme tokeny, takže potřebuješ vlastní BSC peněženku jako cíl výplaty. Ověření je povinné pro všechny služby Yeet a chrání swap před zneužitím.","faq.q4":"Existuje minimum nebo maximum?","faq.a4":"Podrobnosti jako minimální částku a počet potvrzení zveřejníme spolu s oznámením startu. Celkový pool je omezen na 500 mil. YEET.","faq.q5":"Co je vlastně YEET?","faq.a5":"YEET je utility token sociální platformy <a href=\"https://justyeet.it/\">justyeet.it<\/a> (BEP-20 na BNB Smart Chain, pevná celková nabídka 21 mld.). Na platformě získáváš body (příspěvky, odměny, tipy) a jednosměrně je měníš na YEET.","footer.disclaimer":"Nejde o nabídku ani investiční poradenství. Kryptoaktiva mohou ztratit hodnotu.","msg.locked":"Swap je stále uzamčen — start bude oznámen.","msg.kyc":"Nejdřív prosím dokonči ověření (KYC) v nastavení Yeet.","msg.wallet":"Nejdřív prosím propoj svou BSC peněženku v nastavení Yeet (cíl výplaty).","msg.error":"Chyba: {code}","msg.network":"Chyba sítě — zkus to prosím později znovu.","msg.copied":"Adresa zkopírována.","dep.none":"Zatím nebyly zjištěny žádné vklady.","dep.title":"Tvoje vklady","dep.conf":"Potvrz.","dep.status":"Stav","dep.credited":"připsáno","dep.failed":"selhalo","dep.pending":"čeká","lang.label":"Jazyk"},"da":{"meta.title":"NOTE → YEET Swap","meta.desc":"Officielt NOTE→YEET-swap fra Yeet Social. Kurs 100 NOTE = 1 YEET. Start annonceres.","sub":"Den officielle ombytning af Note-blockchain-coins til YEET utility-tokenet (BEP-20, BNB Smart Chain) — direkte hos Yeet Social.","banner.title":"Swappet er ikke startet endnu.","banner.text":"Smart contracten er under forberedelse. Så snart swappet går live, annoncerer vi starten overalt — på justyeet.it, i appen og på alle kanaler. Indtil da er swaps låst. <strong>Send endnu ikke NOTE-coins til nogen adresse!<\/strong>","rate.give":"du giver","rate.get":"du modtager","calc.placeholder":"f.eks. 250000","btn.locked":"🔒 Swap låst — start annonceres","btn.request":"Anmod om indbetalingsadresse","note.fixed":"Fast kurs 100:1 · intet Yeet-gebyr på swappet · netværksgebyrer betaler du selv","note.pool":"pulje brugt","panel.title":"Dit swap","panel.needLogin":"Log først ind på Yeet (samme browser), og anmod derefter om din personlige NOTE-indbetalingsadresse her.","panel.signIn":"Log ind på Yeet","panel.requestText":"Du får en indbetalingsadresse, der kun er knyttet til dig. Send kun NOTE dertil fra din egen wallet.","panel.addrLabel":"Din NOTE-indbetalingsadresse","panel.copy":"Kopiér","hint.addr":"Kurs 100 NOTE = 1 YEET · krediteres efter {n} bekræftelser (~{m} min.)","hint.min":" · minimum {n} NOTE","facts.title":"Nøglefakta","facts.rate":"<b>Fast kurs:<\/b> 100 NOTE = 1 YEET. Kursen er fast og ændres ikke.","facts.oneway":"<b>Envejs:<\/b> Swappet går kun NOTE → YEET. Der er ingen vej tilbage.","facts.fees":"<b>Gebyrer:<\/b> Yeet opkræver intet swap-gebyr. Netværksgebyrer (NOTE-transaktionsgebyr, senere BNB-gas til overførsler, vejledende ~0,01 BNB) betaler du selv.","facts.req":"<b>Krav:<\/b> en Yeet-konto på justyeet.it med gennemført verificering (KYC) og din egen tilknyttede BSC-wallet (f.eks. MetaMask).","facts.pool":"<b>Swap-pulje:<\/b> begrænset til 500.000.000 YEET (fra community-puljen af den faste samlede mængde på 21 mia.) — nok, selv hvis alle NOTE swappes.","facts.team":"<b>Team-coins udelukket:<\/b> Yeet-teamet giver afkald på sine tidligere minede NOTE — de er udelukket fra swappet.","facts.nc":"<b>Non-custodial:<\/b> YEET går direkte til din egen wallet. Yeet opbevarer aldrig tokens for dig.","steps.title":"Sådan kommer swappet til at fungere","steps.1t":"Tilmeld &amp; tilknyt","steps.1":"Log ind på justyeet.it, gennemfør verificering (KYC) og tilknyt din BSC-wallet via det signerede wallet-login.","steps.2t":"Få din personlige NOTE-indbetalingsadresse","steps.2":"Efter lanceringen giver denne side dig en indbetalingsadresse på Note-blockchainen, der kun er knyttet til dig.","steps.3t":"Send NOTE — modtag YEET","steps.3":"Send NOTE fra din egen wallet til din indbetalingsadresse. Efter <span class=\"confN\">tilstrækkeligt mange<\/span> bekræftelser på Note-kæden udbetales 1 YEET pr. 100 NOTE automatisk til din tilknyttede BSC-wallet. Hver udbetaling kan spores i den offentlige explorer.","faq.q1":"Hvornår starter swappet?","faq.a1":"Så snart YEET-smart contracten er færdig og gennemgået. Vi annoncerer startdatoen overalt — der bliver ingen stille lancering. Indtil da: send ikke NOTE til nogen, der lover et \"swap\".","faq.q2":"Hvad sker der med de indbetalte NOTE?","faq.a2":"Indbetalte NOTE tages permanent ud af cirkulation og opbevares på en offentligt synlig adresse — de kommer aldrig tilbage i omløb.","faq.q3":"Hvorfor skal jeg bruge KYC og min egen wallet?","faq.a3":"Yeet er non-custodial: vi opbevarer aldrig tokens for dig, så du skal bruge din egen BSC-wallet som udbetalingsmål. Verificering er påkrævet for alle Yeet-tjenester og beskytter swappet mod misbrug.","faq.q4":"Er der et minimum eller maksimum?","faq.a4":"Detaljer som minimumsbeløb og antal bekræftelser offentliggøres sammen med start-annonceringen. Den samlede pulje er begrænset til 500 mio. YEET.","faq.q5":"Hvad er YEET egentlig?","faq.a5":"YEET er utility-tokenet for den sociale platform <a href=\"https://justyeet.it/\">justyeet.it<\/a> (BEP-20 på BNB Smart Chain, fast samlet mængde på 21 mia.). På platformen optjener du point (opslag, belønninger, tips) og konverterer dem envejs til YEET.","footer.disclaimer":"Ikke et tilbud, ikke investeringsrådgivning. Kryptoaktiver kan tabe værdi.","msg.locked":"Swappet er stadig låst — starten annonceres.","msg.kyc":"Gennemfør først verificering (KYC) i dine Yeet-indstillinger.","msg.wallet":"Tilknyt først din BSC-wallet i dine Yeet-indstillinger (udbetalingsmål).","msg.error":"Fejl: {code}","msg.network":"Netværksfejl — prøv igen senere.","msg.copied":"Adresse kopieret.","dep.none":"Ingen indbetalinger registreret endnu.","dep.title":"Dine indbetalinger","dep.conf":"Bekr.","dep.status":"Status","dep.credited":"krediteret","dep.failed":"mislykket","dep.pending":"afventer","lang.label":"Sprog"},"nl":{"meta.title":"NOTE → YEET Swap","meta.desc":"Officiële NOTE→YEET-swap van Yeet Social. Koers 100 NOTE = 1 YEET. Start wordt aangekondigd.","sub":"De officiële omwisseling van Note-blockchain-coins naar de YEET utility token (BEP-20, BNB Smart Chain) — rechtstreeks bij Yeet Social.","banner.title":"De swap is nog niet gestart.","banner.text":"Het smart contract is in voorbereiding. Zodra de swap live gaat, kondigen we de start overal aan — op justyeet.it, in de app en op alle kanalen. Tot die tijd zijn swaps vergrendeld. <strong>Stuur nog geen NOTE-coins naar welk adres dan ook!<\/strong>","rate.give":"je geeft","rate.get":"je ontvangt","calc.placeholder":"bijv. 250000","btn.locked":"🔒 Swap vergrendeld — start wordt aangekondigd","btn.request":"Stortingsadres aanvragen","note.fixed":"Vaste koers 100:1 · geen Yeet-kosten op de swap · netwerkkosten betaal je zelf","note.pool":"pool gebruikt","panel.title":"Jouw swap","panel.needLogin":"Log eerst in bij Yeet (dezelfde browser) en vraag daarna hier je persoonlijke NOTE-stortingsadres aan.","panel.signIn":"Inloggen bij Yeet","panel.requestText":"Je krijgt een stortingsadres dat alleen aan jou is gekoppeld. Stuur daar alleen NOTE naartoe vanuit je eigen wallet.","panel.addrLabel":"Jouw NOTE-stortingsadres","panel.copy":"Kopiëren","hint.addr":"Koers 100 NOTE = 1 YEET · bijgeschreven na {n} bevestigingen (~{m} min.)","hint.min":" · minimum {n} NOTE","facts.title":"Kerngegevens","facts.rate":"<b>Vaste koers:<\/b> 100 NOTE = 1 YEET. De koers staat vast en verandert niet.","facts.oneway":"<b>Eenrichtingsverkeer:<\/b> De swap gaat alleen NOTE → YEET. Er is geen weg terug.","facts.fees":"<b>Kosten:<\/b> Yeet rekent geen swapkosten. Netwerkkosten (NOTE-transactiekosten, later BNB-gas voor overboekingen, richtwaarde ~0,01 BNB) betaal je zelf.","facts.req":"<b>Vereisten:<\/b> een Yeet-account op justyeet.it met afgeronde verificatie (KYC) en je eigen gekoppelde BSC-wallet (bijv. MetaMask).","facts.pool":"<b>Swap-pool:<\/b> begrensd op 500.000.000 YEET (uit de community-pool van de vaste totale voorraad van 21 mld.) — genoeg, zelfs als elke NOTE wordt geswapt.","facts.team":"<b>Team-coins uitgesloten:<\/b> het Yeet-team ziet af van zijn eerder geminede NOTE — die zijn uitgesloten van de swap.","facts.nc":"<b>Non-custodial:<\/b> YEET gaat rechtstreeks naar je eigen wallet. Yeet bewaart nooit tokens voor jou.","steps.title":"Zo gaat de swap werken","steps.1t":"Aanmelden &amp; koppelen","steps.1":"Log in op justyeet.it, rond de verificatie (KYC) af en koppel je BSC-wallet via de ondertekende wallet-login.","steps.2t":"Ontvang je persoonlijke NOTE-stortingsadres","steps.2":"Na de lancering geeft deze pagina je een stortingsadres op de Note-blockchain dat alleen aan jou is gekoppeld.","steps.3t":"Stuur NOTE — ontvang YEET","steps.3":"Stuur NOTE vanuit je eigen wallet naar je stortingsadres. Na <span class=\"confN\">voldoende<\/span> bevestigingen op de Note-chain wordt automatisch 1 YEET per 100 NOTE uitbetaald naar je gekoppelde BSC-wallet. Elke uitbetaling is traceerbaar in de openbare explorer.","faq.q1":"Wanneer start de swap?","faq.a1":"Zodra het YEET-smart contract klaar en gecontroleerd is. We kondigen de startdatum overal aan — er komt geen stille lancering. Tot die tijd: stuur geen NOTE naar iemand die een \"swap\" belooft.","faq.q2":"Wat gebeurt er met de gestorte NOTE?","faq.a2":"Gestorte NOTE worden permanent uit de omloop genomen en bewaard op een openbaar inzichtelijk adres — ze komen nooit meer terug in omloop.","faq.q3":"Waarom heb ik KYC en een eigen wallet nodig?","faq.a3":"Yeet is non-custodial: we bewaren nooit tokens voor jou, dus je hebt je eigen BSC-wallet nodig als uitbetalingsdoel. Verificatie is verplicht voor alle Yeet-diensten en beschermt de swap tegen misbruik.","faq.q4":"Is er een minimum of maximum?","faq.a4":"Details zoals het minimumbedrag en het aantal bevestigingen publiceren we samen met de startaankondiging. De totale pool is begrensd op 500 mln. YEET.","faq.q5":"Wat is YEET eigenlijk?","faq.a5":"YEET is de utility token van het sociale platform <a href=\"https://justyeet.it/\">justyeet.it<\/a> (BEP-20 op BNB Smart Chain, vaste totale voorraad van 21 mld.). Op het platform verdien je punten (posts, beloningen, tips) en wissel je die onomkeerbaar om in YEET.","footer.disclaimer":"Geen aanbod, geen beleggingsadvies. Crypto-activa kunnen in waarde dalen.","msg.locked":"De swap is nog vergrendeld — de start wordt aangekondigd.","msg.kyc":"Rond eerst de verificatie (KYC) af in je Yeet-instellingen.","msg.wallet":"Koppel eerst je BSC-wallet in je Yeet-instellingen (uitbetalingsdoel).","msg.error":"Fout: {code}","msg.network":"Netwerkfout — probeer het later opnieuw.","msg.copied":"Adres gekopieerd.","dep.none":"Nog geen stortingen gedetecteerd.","dep.title":"Jouw stortingen","dep.conf":"Bev.","dep.status":"Status","dep.credited":"bijgeschreven","dep.failed":"mislukt","dep.pending":"in behandeling","lang.label":"Taal"},"pl":{"meta.title":"NOTE → YEET Swap","meta.desc":"Oficjalny swap NOTE→YEET od Yeet Social. Kurs 100 NOTE = 1 YEET. Start zostanie ogłoszony.","sub":"Oficjalna wymiana coinów blockchainu Note na token użytkowy YEET (BEP-20, BNB Smart Chain) — bezpośrednio w Yeet Social.","banner.title":"Swap jeszcze się nie rozpoczął.","banner.text":"Smart contract jest w przygotowaniu. Gdy tylko swap ruszy, ogłosimy start wszędzie — na justyeet.it, w aplikacji i na wszystkich kanałach. Do tego czasu swapy są zablokowane. <strong>Nie wysyłaj jeszcze coinów NOTE na żaden adres!<\/strong>","rate.give":"dajesz","rate.get":"otrzymujesz","calc.placeholder":"np. 250000","btn.locked":"🔒 Swap zablokowany — start zostanie ogłoszony","btn.request":"Poproś o adres wpłaty","note.fixed":"Stały kurs 100:1 · brak opłaty Yeet za swap · opłaty sieciowe pokrywasz sam","note.pool":"wykorzystano z puli","panel.title":"Twój swap","panel.needLogin":"Najpierw zaloguj się do Yeet (w tej samej przeglądarce), a potem poproś tutaj o swój osobisty adres wpłaty NOTE.","panel.signIn":"Zaloguj się do Yeet","panel.requestText":"Otrzymasz adres wpłaty przypisany wyłącznie do ciebie. Wysyłaj na niego NOTE tylko z własnego portfela.","panel.addrLabel":"Twój adres wpłaty NOTE","panel.copy":"Kopiuj","hint.addr":"Kurs 100 NOTE = 1 YEET · zaksięgowanie po {n} potwierdzeniach (~{m} min)","hint.min":" · minimum {n} NOTE","facts.title":"Najważniejsze fakty","facts.rate":"<b>Stały kurs:<\/b> 100 NOTE = 1 YEET. Kurs jest stały i nie ulegnie zmianie.","facts.oneway":"<b>Jednokierunkowo:<\/b> Swap działa tylko NOTE → YEET. Nie ma drogi powrotnej.","facts.fees":"<b>Opłaty:<\/b> Yeet nie pobiera żadnej opłaty za swap. Opłaty sieciowe (opłata transakcyjna NOTE, później gas BNB za transfery, orientacyjnie ~0,01 BNB) pokrywasz sam.","facts.req":"<b>Wymagania:<\/b> konto Yeet na justyeet.it z ukończoną weryfikacją (KYC) oraz własny, podłączony portfel BSC (np. MetaMask).","facts.pool":"<b>Pula swapu:<\/b> ograniczona do 500 000 000 YEET (z puli społeczności w ramach stałej całkowitej podaży 21 mld) — wystarczy nawet wtedy, gdy wymienione zostaną wszystkie NOTE.","facts.team":"<b>Coiny zespołu wykluczone:<\/b> zespół Yeet rezygnuje ze swoich wcześniej wykopanych NOTE — są one wykluczone ze swapu.","facts.nc":"<b>Non-custodial:<\/b> YEET trafiają prosto do twojego własnego portfela. Yeet nigdy nie przechowuje tokenów za ciebie.","steps.title":"Jak będzie działać swap","steps.1t":"Rejestracja &amp; podłączenie","steps.1":"Zaloguj się na justyeet.it, ukończ weryfikację (KYC) i podłącz swój portfel BSC przez podpisane logowanie portfelem.","steps.2t":"Odbierz swój osobisty adres wpłaty NOTE","steps.2":"Po starcie ta strona przydzieli ci adres wpłaty na blockchainie Note, przypisany wyłącznie do ciebie.","steps.3t":"Wyślij NOTE — otrzymaj YEET","steps.3":"Wyślij NOTE z własnego portfela na swój adres wpłaty. Gdy na łańcuchu Note pojawi się <span class=\"confN\">wystarczająco dużo<\/span> potwierdzeń, 1 YEET za każde 100 NOTE zostanie automatycznie wypłacony do twojego podłączonego portfela BSC. Każdą wypłatę można prześledzić w publicznym eksploratorze.","faq.q1":"Kiedy startuje swap?","faq.a1":"Gdy tylko smart contract YEET będzie gotowy i sprawdzony. Datę startu ogłosimy wszędzie — nie będzie cichego startu. Do tego czasu: nie wysyłaj NOTE nikomu, kto obiecuje „swap”.","faq.q2":"Co dzieje się z wpłaconymi NOTE?","faq.a2":"Wpłacone NOTE są trwale wycofywane z obiegu i przechowywane pod publicznie widocznym adresem — nigdy nie wracają do obiegu.","faq.q3":"Dlaczego potrzebuję KYC i własnego portfela?","faq.a3":"Yeet jest non-custodial: nigdy nie przechowujemy tokenów za ciebie, dlatego potrzebujesz własnego portfela BSC jako celu wypłaty. Weryfikacja jest wymagana we wszystkich usługach Yeet i chroni swap przed nadużyciami.","faq.q4":"Czy jest minimum lub maksimum?","faq.a4":"Szczegóły, takie jak minimalna kwota i liczba potwierdzeń, zostaną opublikowane wraz z ogłoszeniem startu. Całkowita pula jest ograniczona do 500 mln YEET.","faq.q5":"Czym właściwie jest YEET?","faq.a5":"YEET to token użytkowy platformy społecznościowej <a href=\"https://justyeet.it/\">justyeet.it<\/a> (BEP-20 na BNB Smart Chain, stała całkowita podaż 21 mld). Na platformie zdobywasz punkty (posty, nagrody, napiwki) i jednokierunkowo zamieniasz je na YEET.","footer.disclaimer":"To nie jest oferta ani porada inwestycyjna. Kryptoaktywa mogą stracić na wartości.","msg.locked":"Swap jest nadal zablokowany — start zostanie ogłoszony.","msg.kyc":"Najpierw ukończ weryfikację (KYC) w ustawieniach Yeet.","msg.wallet":"Najpierw podłącz swój portfel BSC w ustawieniach Yeet (cel wypłaty).","msg.error":"Błąd: {code}","msg.network":"Błąd sieci — spróbuj ponownie później.","msg.copied":"Adres skopiowany.","dep.none":"Nie wykryto jeszcze żadnych wpłat.","dep.title":"Twoje wpłaty","dep.conf":"Potw.","dep.status":"Status","dep.credited":"zaksięgowano","dep.failed":"nieudane","dep.pending":"oczekuje","lang.label":"Język"},"hr":{"meta.title":"NOTE → YEET Swap","meta.desc":"Službeni NOTE→YEET swap platforme Yeet Social. Tečaj 100 NOTE = 1 YEET. Početak će biti objavljen.","sub":"Službena zamjena coina Note blockchaina za YEET utility token (BEP-20, BNB Smart Chain) — izravno ovdje, na platformi Yeet Social.","banner.title":"Swap još nije počeo.","banner.text":"Pametni ugovor (smart contract) je u pripremi. Čim swap krene uživo, početak ćemo objaviti posvu it, dovrši verifikaciju (KYC) i poveži svoj BSC novčanik putem potpisane prijave novčanikom.","steps.2t":"Dobij svoju osobnu NOTE adresu za uplatu","steps.2":"Nakon pokretanja ova ti stranica daje adresu za uplatu na Note blockchainu koja je dodijeljena samo tebi.","steps.3t":"Pošalji NOTE — primi YEET","steps.3":"Pošalji NOTE iz vlastitog novčanika na svoju adresu za uplatu. Nakon <span class=\"confN\">dovoljno<\/span> potvrda na Note lancu automatski se isplaćuje 1 YEET po 100 NOTE na tvoj povezani BSC novčanik. Svaka je isplata provjerljiva u javnom exploreru.","faq.q1":"Kada počinje swap?","faq.a1":"Čim YEET pametni ugovor bude dovršen i pregledan. Datum početka objavit ćemo posvuda — tihog pokretanja neće biti. Do tada: ne šalji NOTE nikome tko obećava „swap“.","faq.q2":"Što se događa s uplaćenim NOTE?","faq.a2":"Uplaćeni NOTE trajno se povlače iz optjecaja i čuvaju na javno vidljivoj adresi — nikada se ne vraćaju u optjecaj.","faq.q3":"Zašto mi trebaju KYC i vlastiti novčanik?","faq.a3":"Yeet je non-custodial: nikada ne čuvamo tokene umjesto tebe, pa ti treba vlastiti BSC novčanik kao odredište isplate. Verifikacija je obavezna za sve Yeet usluge i štiti swap od zlouporabe.","faq.q4":"Postoji li minimum ili maksimum?","faq.a4":"Detalje poput minimalnog iznosa i broja potvrda objavit ćemo zajedno s najavom početka. Ukupni pool ograničen je na 500 mil. YEET.","faq.q5":"Što je uopće YEET?","faq.a5":"YEET je utility token društvene platforme <a href=\"https://justyeet.it/\">justyeet.it<\/a> (BEP-20 na mreži BNB Smart Chain, fiksna ukupna ponuda od 21 mlrd.). Na platformi zarađuješ bodove (objave, nagrade, napojnice) i jednosmjerno ih pretvaraš u YEET.","footer.disclaimer":"Ovo nije ponuda ni investicijski savjet. Kriptoimovina može izgubiti vrijednost.","msg.locked":"Swap je još zaključan — početak će biti objavljen.","msg.kyc":"Najprije dovrši verifikaciju (KYC) u svojim Yeet postavkama.","msg.wallet":"Najprije poveži svoj BSC novčanik u Yeet postavkama (odredišt i maksimum?","faq.a4":"Detalje poput minimalnog iznosa i broja potvrda objavićemo zajedno sa najavom početka. Ukupni pool je ograničen na 500 mil. YEET.","faq.q5":"Šta je uopšte YEET?","faq.a5":"YEET je utility token društvene platforme <a href=\"https://justyeet.it/\">justyeet.it<\/a> (BEP-20 na mreži BNB Smart Chain, fiksna ukupna ponuda od 21 mlrd.). Na platformi zarađuješ poene (objave, nagrade, napojnice) i jednosmerno ih pretvaraš u YEET.","footer.disclaimer":"Ovo nije ponuda niti investicioni savet. Kriptoimovina može izgubiti vrednost.","msg.locked":"Swap je još zaključan — početak će biti objavljen.","msg.kyc":"Prvo završi verifikaciju (KYC) u svojim Yeet podešavanjima.","msg.wallet":"Prvo poveži svoj BSC novčanik u Yeet podešavanjima (odredište isplate).","msg.error":"Greška: {code}","msg.network":"Mrežna greška — pokušaj ponovo kasnije.","msg.copied":"Adresa kopirana.","dep.none":"Još nema otkrivenih uplata.","dep.title":"Tvoje uplate","dep.conf":"Potv.","dep.status":"Status","dep.credited":"upisano","dep.failed":"neuspešno","dep.pending":"na čekanju","lang.label":"Jezik"},"tr":{"meta.title":"NOTE → YEET Swap","meta.desc":"Yeet Social'ın resmi NOTE→YEET swap'ı. Kur 100 NOTE = 1 YEET. Başlangıç duyurulacak.","sub":"Note blockchain coinlerinin YEET utility token'a (BEP-20, BNB Smart Chain) resmi olarak takas edilmesi — doğrudan burada, Yeet Social'da.","banner.title":"Swap henüz başlamadı.","banner.text":"Akıllı sözleşme hazırlık aşamasında. Swap yayına girdiğinde başlangıcı her yerde duyuracağız — justyeet.it'te, uygulamada ve tüm kanallarda. O zamana kadar swap'lar kilitli. <strong>Henüz hiçbir adrese NOTE coin gönderme!<\/strong>","rate.give":"verdiğin","rate.get":"aldığın","calc.placeholder":"örn. 250000","btn.locked":"🔒 Swap kilitli — başlangıç duyurulacak","btn.request":"Yatırma adresi iste","note.fixed":"Sabit kur 100:1 · swap için Yeet ücreti yok · ağ ücretlerini sen karşılarsın","note.pool":"kullanılan havuz","panel.title":"Swap'ın","panel.needLogi enebilir.","faq.q1":"Swap ne zaman başlıyor?","faq.a1":"YEET akıllı sözleşmesi tamamlanıp incelendiği anda. Başlangıç tarihini her yerde duyuracağız — sessiz bir başlangıç olmayacak. O zamana kadar: \"swap\" vaat eden hiç kimseye NOTE gönderme.","faq.q2":"Yatırılan NOTE'lara ne olur?","faq.a2":"Yatırılan NOTE'lar kalıcı olarak dolaşımdan çıkarılır ve herkese açık görüntülenebilen bir adreste tutulur — asla yeniden dolaşıma girmez.","faq.q3":"Neden KYC ve kendi cüzdanıma ihtiyacım var?","faq.a3":"Yeet non-custodial'dır: senin adına asla token tutmayız, bu yüzden ödeme hedefi olarak kendi BSC cüzdanına ihtiyacın var. Doğrulama tüm Yeet hizmetleri için zorunludur ve swap'ı kötüye kullanıma karşı korur.","faq.q4":"Minimum veya maksimum var mı?","faq.a4":"Minimum tutar ve onay sayısı gibi ayrıntılar başlangıç duyurusuyla birlikte yayımlanacak. Toplam havuz 500 milyon YEET ile sınırlıdır.","faq.q5":"Peki YEET nedir?","faq.a5":"YEET, sosyal platform <a href=\"https://justyeet.it/\">justyeet.it<\/a>'in utility token'ıdır (BNB Smart Chain üzerinde BEP-20, sabit toplam arz 21 milyar). Platformda puan kazanırsın (gönderiler, ödüller, bahşişler) ve bunları tek yönlü olarak YEET'e dönüştürürsün.","footer.disclaimer":"Bu bir teklif veya yatırım tavsiyesi değildir. Kripto varlıklar değer kaybedebilir.","msg.locked":"Swap hâlâ kilitli — başlangıç duyurulacak.","msg.kyc":"Lütfen önce Yeet ayarlarında doğrulamayı (KYC) tamamla.","msg.wallet":"Lütfen önce Yeet ayarlarında BSC cüzdanını bağla (ödeme hedefi).","msg.error":"Hata: {code}","msg.network":"Ağ hatası — lütfen daha sonra tekrar dene.","msg.copied":"Adres kopyalandı.","dep.none":"Henüz yatırma tespit edilmedi.","dep.title":"Yatırmaların","dep.conf":"Onay","dep.status":"Durum","dep.credited":"hesaba geçti","dep.failed":"başarısız","dep.pending":"bekliyor","lang.label":"Dil"},"lv":{"meta.title":"NOTE → YEET Swap","meta.desc":"Oficiālā Yeet Social NOTE→YEET maiņa (swap). Kurss 100 NOTE = 1 YEET. Sākums tiks paziņots.","sub":"Oficiālā Note blokķēdes monētu apmaiņa pret YEET utility tokenu (BEP-20, BNB Smart Chain) — tieši šeit, Yeet Social platformā.","banner.title":"Maiņa vēl nav sākusies.","banner.text":"Viedais līgums (smart contract) tiek gatavots. Tiklīdz maiņa sāks darboties, mēs par sākumu paziņosim visur — justyeet.it, lietotnē un visos kanālos. Līdz tam maiņa ir bloķēta. <strong>Pagaidām nesūti NOTE monētas ne uz vienu adresi!<\/strong>","rate.give":"tu dod","rate.get":"tu saņem","calc.placeholder":"piem. 250000","btn.locked":"🔒 Maiņa bloķēta — sākums tiks paziņots","btn.request":"Pieprasīt iemaksas adresi","note.fixed":"Fiksēts kurss 100:1 · bez Yeet komisijas par maiņu · tīkla maksas sedz tu","note.pool":"pūla izlietojums","panel.title":"Tava maiņa","panel.needLogin":"Vispirms pieraksties Yeet (tajā pašā pārlūkā), pēc tam šeit pieprasi savu personīgo NOTE iemaksas adresi.","panel.signIn":"Pierakstīties Yeet","panel.requestText":"Tu saņem iemaksas adresi, kas piesaistīta tikai tev. Sūti uz to NOTE tikai no sava maka.","panel.addrLabel":"Tava NOTE iemaksas adrese","panel.copy":"Kopēt","hint.addr":"Kurss 100 NOTE = 1 YEET · ieskaitīts pēc {n} apstiprinājumiem (~{m} min)","hint.min":" · minimums {n} NOTE","facts.title":"Galvenie fakti","facts.rate":"<b>Fiksēts kurss:<\/b> 100 NOTE = 1 YEET. Kurss ir fiksēts un nemainīsies.","facts.oneway":"<b>Vienvirziena:<\/b> Maiņa notiek tikai NOTE → YEET. Atpakaļceļa nav.","facts.fees":"<b>Maksas:<\/b> Yeet neiekasē komisiju par maiņu. Tīkla maksas (NOTE darījuma maksa, vēlāk BNB gas pārskaitījumiem, aptuveni ~0,01 BNB) sedz tu.","facts.req":"<b>Prasības:<\/b> Yeet konts justyeet.it ar pabeigtu verifikāciju (KYC) un savs piesaistīts BSC maks (piem. MetaMask).","facts.pool":"<b>Maiņas pūls:<\/b> ierobežots līdz 500 000 000 YEET (no kopienas pūla fiksētajā 21 mljrd. kopējā piedāvājumā) — pietiek pat tad, ja tiek apmainīts katrs NOTE.","facts.team":"<b>Komandas monētas izslēgtas:<\/b> Yeet komanda atsakās no saviem iepriekš izraktajiem NOTE — tie ir izslēgti no maiņas.","facts.nc":"<b>Non-custodial (bez glabāšanas):<\/b> YEET nonāk tieši tavā makā. Yeet nekad neglabā tokenus tavā vietā.","steps.title":"Kā maiņa darbosies","steps.1t":"Reģistrējies &amp; piesaisti","steps.1":"Pieraksties justyeet.it, pabeidz verifikāciju (KYC) un piesaisti savu BSC maku, izmantojot parakstīto maka pieteikšanos.","steps.2t":"Saņem savu personīgo NOTE iemaksas adresi","steps.2":"Pēc starta šī lapa tev iedos iemaksas adresi Note blokķēdē, kas piesaistīta tikai tev.","steps.3t":"Sūti NOTE — saņem YEET","steps.3":"Sūti NOTE no sava maka uz savu iemaksas adresi. Pēc <span class=\"confN\">pietiekamiem<\/span> apstiprinājumiem Note ķēdē uz tavu piesaistīto BSC maku automātiski tiek izmaksāts 1 YEET par katriem 100 NOTE. Katra izmaksa ir izsekojama publiskajā pārlūkā (explorer).","faq.q1":"Kad sāksies maiņa?","faq.a1":"Tiklīdz YEET viedais līgums būs pabeigts un pārbaudīts. Sākuma datumu paziņosim visur — klusa starta nebūs. Līdz tam: nesūti NOTE nevienam, kas sola „swap“.","faq.q2":"Kas notiek ar iemaksātajiem NOTE?","faq.a2":"Iemaksātie NOTE tiek neatgriezeniski izņemti no apgrozības un glabāti publiski apskatāmā adresē — tie nekad neatgriežas apgrozībā.","faq.q3":"Kāpēc man vajadzīgs KYC un savs maks?","faq.a3":"Yeet ir non-custodial: mēs nekad neglabājam tokenus tavā vietā, tāpēc tev ir vajadzīgs savs BSC maks kā izmaksas mērķis. Verifikācija ir obligāta visiem Yeet pakalpojumiem un aizsargā maiņu pret ļaunprātīgu izmantošanu.","faq.q4":"Vai ir minimums vai maksimums?","faq.a4":"Detaļas, piemēram, minimālā summa un apstiprinājumu skaits, tiks publicētas kopā ar starta paziņojumu. Kopējais pūls ir ierobežots līdz 500 milj. YEET.","faq.q5":"Kas vispār ir YEET?","faq.a5":"YEET ir sociālās platformas <a href=\"https://justyeet.it/\">justyeet.it<\/a> utility tokens (BEP-20 BNB Smart Chain tīklā, fiksēts kopējais piedāvājums 21 mljrd.). Platformā tu pelni punktus (ieraksti, atlīdzības, dzeramnaudas) un maini tos vienā virzienā pret YEET.","footer.disclaimer":"Tas nav piedāvājums un nav ieguldījumu konsultācija. Kriptoaktīvi var zaudēt vērtību.","msg.locked":"Maiņa vēl ir bloķēta — sākums tiks paziņots.","msg.kyc":"Lūdzu, vispirms pabeidz verifikāciju (KYC) savos Yeet iestatījumos.","msg.wallet":"Lūdzu, vispirms piesaisti savu BSC maku Yeet iestatījumos (izmaksas mērķis).","msg.error":"Kļūda: {code}","msg.network":"Tīkla kļūda — lūdzu, mēģini vēlreiz vēlāk.","msg.copied":"Adrese nokopēta.","dep.none":"Iemaksas vēl nav konstatētas.","dep.title":"Tavas iemaksas","dep.conf":"Apst.","dep.status":"Statuss","dep.credited":"ieskaitīts","dep.failed":"neizdevās","dep.pending":"gaida","lang.label":"Valoda"}};
var NATIVE={en:'English',de:'Deutsch',it:'Italiano',fr:'Français',es:'Español',pt:'Português',fi:'Suomi',sv:'Svenska',nb:'Norsk',is:'Íslenska',cs:'Čeština',da:'Dansk',nl:'Nederlands',pl:'Polski',hr:'Hrvatski',sr:'Srpski',tr:'Türkçe',lv:'Latviešu'};
var LOCALE={en:'en-US',de:'de-DE',it:'it-IT',fr:'fr-FR',es:'es-ES',pt:'pt-BR',fi:'fi-FI',sv:'sv-SE',nb:'nb-NO',is:'is-IS',cs:'cs-CZ',da:'da-DK',nl:'nl-NL',pl:'pl-PL',hr:'hr-HR',sr:'sr-Latn-RS',tr:'tr-TR',lv:'lv-LV'};
function L(){ return document.documentElement.lang || 'en'; }
function t(k,v){ var d=SWAP_DICTS[L()]||SWAP_DICTS.en||{}; var s=d[k]!==undefined?d[k]:(SWAP_DICTS.en||{})[k]; if(s===undefined) return k; if(v) s=s.replace(/\{(\w+)\}/g,function(_,x){return v[x]!=null?v[x]:'';}); return s; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(function(e){ e.textContent=t(e.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-html]').forEach(function(e){ e.innerHTML=t(e.getAttribute('data-i18n-html')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(e){ e.setAttribute('placeholder',t(e.getAttribute('data-i18n-placeholder'))); });
  document.querySelectorAll('[data-i18n-aria]').forEach(function(e){ e.setAttribute('aria-label',t(e.getAttribute('data-i18n-aria'))); });
  document.querySelectorAll('[data-i18n-content]').forEach(function(e){ e.setAttribute('content',t(e.getAttribute('data-i18n-content'))); });
  document.querySelectorAll('.confN').forEach(function(e){ if(SWAP.loaded) e.textContent=SWAP.conf; });
}
function setL(l){
  if(!SWAP_DICTS[l]) l='en';
  document.documentElement.lang=l;
  var sel=document.getElementById('langSel'); if(sel&&sel.value!==l) sel.value=l;
  try{ localStorage.setItem('yeet_lang',l); }catch(e){}
  applyI18n(); calc(); if(SWAP.loaded) renderStatus();
}
function initLang(){
  var sel=document.getElementById('langSel');
  Object.keys(NATIVE).forEach(function(c){ if(!SWAP_DICTS[c]) return; var o=document.createElement('option'); o.value=c; o.textContent=NATIVE[c]; sel.appendChild(o); });
  var l='en';
  try{ l=localStorage.getItem('yeet_lang')||''; }catch(e){}
  if(!l||!SWAP_DICTS[l]){ var nav=((navigator.languages&&navigator.languages[0])||navigator.language||'').slice(0,2).toLowerCase(); if(nav==='no'||nav==='nn') nav='nb'; l=SWAP_DICTS[nav]?nav:'en'; }
  setL(l);
}
function fmt(n,opts){ return Number(n).toLocaleString(LOCALE[L()]||'en-US',opts||{maximumFractionDigits:2}); }
function calc(){
  var n=parseFloat(document.getElementById('inNote').value)||0;
  var y=n/100;
  document.getElementById('outYeet').value=n>0?fmt(y,{maximumFractionDigits:2}):'';
}
var SWAP={loaded:false,enabled:false,rate:100,conf:120,cap:500000000,swapped:0,min:0};
function jwt(){try{return localStorage.getItem('yeet_jwt')||'';}catch(e){return '';}}
function msg(key,vars,isErr){var m=document.getElementById('swapMsg');m.style.display='';m.textContent=t(key,vars);m.style.borderColor=isErr?'rgba(192,57,43,.5)':'rgba(var(--warn-rgb),.35)';}
function renderStatus(){
  var pct=SWAP.cap>0?Math.min(100,SWAP.swapped/SWAP.cap*100):0;
  var note=document.getElementById('swapNote'); if(note) note.textContent=t('note.fixed')+' · '+t('note.pool')+': '+fmt(pct,{maximumFractionDigits:2})+'%';
  var btn=document.getElementById('swapBtn');
  if(SWAP.enabled){
    var b=document.querySelector('.banner'); if(b) b.style.display='none';
    if(btn){btn.disabled=false;btn.style.cursor='pointer';btn.style.background='var(--accent)';btn.style.color='var(--on-accent)';btn.textContent=t('btn.request');btn.onclick=requestAddress;}
    document.getElementById('swapPanel').style.display='';
    if(!jwt()){document.getElementById('swapNeedLogin').style.display='';}
    else if(document.getElementById('swapAddr').style.display==='none'){document.getElementById('swapRequest').style.display='';}
  }
}
async function loadStatus(){
  try{
    var r=await fetch('/api/v1/swap/status',{cache:'no-store'}); if(!r.ok) return;
    var d=await r.json(); var st=(d&&d.data)||{};
    SWAP.loaded=true; SWAP.enabled=!!st.enabled; SWAP.rate=st.note_per_yeet||100; SWAP.conf=st.confirmations_required||120;
    SWAP.cap=st.pool_cap_yeet||SWAP.cap; SWAP.swapped=st.swapped_yeet||0; SWAP.min=st.min_note||0;
    document.querySelectorAll('.confN').forEach(function(e){e.textContent=SWAP.conf;});
    renderStatus();
    if(SWAP.enabled&&jwt()) loadDeposits(true);
  }catch(e){}
}
async function requestAddress(){
  var tk=jwt(); if(!tk){document.getElementById('swapNeedLogin').style.display='';return;}
  var btn=document.getElementById('btnAddr'); if(btn){btn.disabled=true;}
  try{
    var r=await fetch('/api/v1/swap/address',{method:'POST',headers:{'Authorization':'Bearer '+tk,'Content-Type':'application/json'}});
    var d=await r.json().catch(function(){return {};});
    if(!r.ok){
      var code=(d.error&&d.error.message)||'';
      if(code.indexOf('SWAP_LOCKED')>=0) msg('msg.locked',null,true);
      else if(code.indexOf('KYC_REQUIRED')>=0) msg('msg.kyc',null,true);
      else if(code.indexOf('NO_WALLET_LINKED')>=0) msg('msg.wallet',null,true);
      else if(r.status===401) {document.getElementById('swapNeedLogin').style.display='';document.getElementById('swapRequest').style.display='none';}
      else msg('msg.error',{code:code||r.status},true);
      if(btn) btn.disabled=false; return;
    }
    showAddress(d.data);
  }catch(e){ msg('msg.network',null,true); if(btn) btn.disabled=false; }
}
function showAddress(a){
  document.getElementById('swapRequest').style.display='none';
  document.getElementById('swapAddr').style.display='';
  document.getElementById('addrText').textContent=a.note_address||'';
  var conf=a.confirmations_required||SWAP.conf;
  document.getElementById('addrHint').textContent = t('hint.addr',{n:conf,m:Math.round(conf*30/60)}) + (SWAP.min>0?t('hint.min',{n:fmt(SWAP.min)}):'');
  loadDeposits(false);
}
function copyAddr(){var tx=document.getElementById('addrText').textContent;if(navigator.clipboard&&tx){navigator.clipboard.writeText(tx).then(function(){msg('msg.copied',null,false);});}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
async function loadDeposits(quiet){
  var tk=jwt(); if(!tk) return;
  try{
    var r=await fetch('/api/v1/swap/deposits',{headers:{'Authorization':'Bearer '+tk},cache:'no-store'}); if(!r.ok) return;
    var d=await r.json(); var rows=(d&&d.data)||[];
    if(!rows.length){ if(!quiet){document.getElementById('depWrap').innerHTML='<p style="color:var(--muted);font-size:13px;margin:0">'+esc(t('dep.none'))+'</p>';} return; }
    var h='<div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">'+esc(t('dep.title'))+'</div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">';
    h+='<tr style="color:var(--muted);text-align:left"><th style="padding:6px 8px;font-weight:600">TX</th><th style="padding:6px 8px;font-weight:600">NOTE</th><th style="padding:6px 8px;font-weight:600">YEET</th><th style="padding:6px 8px;font-weight:600">'+esc(t('dep.conf'))+'</th><th style="padding:6px 8px;font-weight:600">'+esc(t('dep.status'))+'</th></tr>';
    rows.forEach(function(x){
      var st=x.status==='credited'?t('dep.credited'):x.status==='failed'?t('dep.failed'):t('dep.pending');
      var col=x.status==='credited'?'var(--accent)':x.status==='failed'?'#e07a6a':'var(--muted)';
      var tx=String(x.txid||''); tx=tx.length>14?tx.slice(0,8)+'…'+tx.slice(-6):tx;
      h+='<tr style="border-top:1px solid var(--border)"><td style="padding:8px;font-family:ui-monospace,monospace">'+esc(tx)+'</td><td style="padding:8px">'+fmt(x.amount_note)+'</td><td style="padding:8px">'+fmt((x.amount_note||0)/SWAP.rate)+'</td><td style="padding:8px">'+(x.confirmations||0)+'/'+SWAP.conf+'</td><td style="padding:8px;color:'+col+'">'+esc(st)+(x.last_error?' <span title="'+esc(x.last_error)+'">ⓘ</span>':'')+'</td></tr>';
    });
    h+='</table></div>';
    document.getElementById('depWrap').innerHTML=h;
  }catch(e){}
}
initLang();
document.addEventListener('DOMContentLoaded', loadStatus);
</script>
</body>
</html>
