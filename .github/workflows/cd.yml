name: CD — Deploy to Hostinger VPS

# Deploys run ONLY after CI succeeded on main (no direct push trigger: that
# used to ship untested commits, twice per push) and fetch every file by the
# exact commit SHA that CI tested, never "whatever main is right now".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS (76.13.150.206)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://justyeet.it

    steps:
      # Preferred: the unprivileged `deploy` account (audit I-H1). It exists
      # once vps/setup-deploy-user.sh ran (ops workflow → setup-deploy-user);
      # until then this step fails fast and the root step below takes over.
      - name: Deploy via SSH (deploy user)
        id: as_deploy
        continue-on-error: true
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: 76.13.150.206
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          envs: DEPLOY_SHA
          script: |
            set -e
            curl -fsSL "https://raw.githubusercontent.com/Zauni1984/Yeet-Social/${DEPLOY_SHA}/vps/cd-deploy.sh" -o /tmp/yeet-cd-deploy.sh
            DEPLOY_SHA="${DEPLOY_SHA}" bash /tmp/yeet-cd-deploy.sh

      - name: Deploy via SSH (root fallback)
        if: steps.as_deploy.outcome == 'failure'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: 76.13.150.206
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          envs: DEPLOY_SHA
          script: |
            set -e
            curl -fsSL "https://raw.githubusercontent.com/Zauni1984/Yeet-Social/${DEPLOY_SHA}/vps/cd-deploy.sh" -o /tmp/yeet-cd-deploy.sh
            DEPLOY_SHA="${DEPLOY_SHA}" bash /tmp/yeet-cd-deploy.sh
