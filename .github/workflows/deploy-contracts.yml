name: Deploy Contracts — BNB Smart Chain

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm deployment'
        required: true
        default: ''
      network:
        description: 'Target network'
        required: true
        default: 'bsc_testnet'
        type: choice
        options:
          - bsc_testnet
          - bsc_mainnet
      scope:
        description: 'What to deploy: token (points model, recommended) or all (token + payments + escrow + NFT)'
        required: true
        default: 'token'
        type: choice
        options:
          - token
          - all
      minter_address:
        description: 'Backend minter address (address of REWARDS_MINTER_PRIVKEY). Empty = deployer (testnet only).'
        required: false
        default: ''
      daily_mint_cap:
        description: 'Daily mint cap in whole YEET (1 to 78750000 = 0.5 % of the reward reserve)'
        required: false
        default: '1000000'
      owner_address:
        description: 'Multisig that takes over ownership (must call acceptOwnership). Required on mainnet.'
        required: false
        default: ''
      treasury_address:
        description: 'Receives the 25 % initial tranches. Empty = owner_address, else deployer. Must be a contract on mainnet.'
        required: false
        default: ''
      guardian_address:
        description: 'Optional key that may pause minting (never resume)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to BNB Smart Chain
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DEPLOY'
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: stable
      - name: Install dependencies (pinned — the contracts are written for OZ 5.1.0; >= 5.2 needs evm_version cancun)
        run: |
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 --branch v1.9.6 https://github.com/foundry-rs/forge-std lib/forge-std
      - name: Build
        run: forge build
      - name: Test (must pass before deploy)
        run: forge test -v
      - name: Deploy
        env:
          PRIVATE_KEY: ${{ secrets.BNB_PRIVATE_KEY }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          MINTER_ADDRESS: ${{ github.event.inputs.minter_address }}
          DAILY_MINT_CAP: ${{ github.event.inputs.daily_mint_cap }}
          OWNER_ADDRESS: ${{ github.event.inputs.owner_address }}
          TREASURY_ADDRESS: ${{ github.event.inputs.treasury_address }}
          GUARDIAN_ADDRESS: ${{ github.event.inputs.guardian_address }}
        run: |
          if [ -z "$MINTER_ADDRESS" ]; then unset MINTER_ADDRESS; fi
          if [ -z "$OWNER_ADDRESS" ]; then unset OWNER_ADDRESS; fi
          if [ -z "$TREASURY_ADDRESS" ]; then unset TREASURY_ADDRESS; fi
          if [ -z "$GUARDIAN_ADDRESS" ]; then unset GUARDIAN_ADDRESS; fi
          SCRIPT=script/DeployToken.s.sol
          if [ "${{ github.event.inputs.scope }}" = "all" ]; then SCRIPT=script/Deploy.s.sol; fi
          echo "Deploying $SCRIPT to ${{ github.event.inputs.network }}"
          forge script "$SCRIPT" \
            --rpc-url ${{ github.event.inputs.network }} \
            --broadcast --verify -vv 2>&1 | tee deploy-output.txt
          grep -E "YeetToken|YeetPayments|PaperWalletEscrow|YeetNFT|YEET_TOKEN_ADDRESS" deploy-output.txt | grep "0x" || true
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deploy-${{ github.event.inputs.network }}-${{ github.run_number }}
          path: contracts/deploy-output.txt
          retention-days: 90
