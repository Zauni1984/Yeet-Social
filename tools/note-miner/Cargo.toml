[package]
name = "note-miner"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json = "1"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }
hex = "0.4"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Stand-alone tool: not a member of the repository workspace.
[workspace]
