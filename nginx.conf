worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server yeet-backend:8080;
    }

    server_tokens off;

    # Per-IP request limits for the credential-bearing route classes (the
    # backend throttles too; this stops floods before they reach it).
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=30r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=60r/m;
    limit_req_status 429;
    # Security headers are set at server level and repeated inside every
    # location that uses add_header itself (nginx add_header does not inherit).

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name justyeet.it www.justyeet.it;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name justyeet.it www.justyeet.it;

        ssl_certificate     /etc/letsencrypt/live/justyeet.it/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/justyeet.it/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;

        # Default body cap for JSON routes; media routes raise it below.
        client_max_body_size 2M;

        # API -> Rust backend
        # Service-worker JS is baked into the backend binary so the
        # nginx docroot doesn't need to keep a static copy in sync
        # with deploys. Strict no-cache so users always get the
        # latest copy after a deploy.
        location = /sw.js {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-store, max-age=0" always;
        }

        # WebSocket upgrade for the messaging realtime channel.
        # Needs Connection/Upgrade headers and a long read timeout so
        # idle sockets don't get reaped by nginx between heartbeats.
        location = /api/v1/ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 30s;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
        }

        # Credential routes: throttled; the admin API is never written to
        # the access log (GETs may carry ?secret=...; the SPA now sends the
        # X-Admin-Secret header, but defence in depth costs nothing here).
        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 30s;
        }
        location /api/v1/admin/ {
            access_log off;
            limit_req zone=admin burst=30 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 30s;
        }
        # Media uploads: the only routes that accept large bodies (post media
        # 32 MB video + envelope; avatar/cover/DM images <= 12 MB; age
        # verification photos <= 24 MB; matches the backend per-route caps).
        location ~ ^/api/v1/(uploads/post-media|users/me/(avatar|cover)|conversations/[^/]+/messages/image|me/age-verification/submit)$ {
            client_max_body_size 40M;
            proxy_request_buffering off;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Uploaded media (avatars, covers) served by the backend
        location /uploads/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1h;
            # Uploads are user content: never let the browser sniff them into
            # HTML/scripts, never allow them to be framed or run scripts.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "DENY" always;
        }

        # Frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            # SPA shell: must NEVER be cached past the next deploy or
            # users hold onto a stale build that, for example, doesn't
            # know how to log out properly. no-store (not just
            # no-cache) so intermediaries don't keep a copy at all.
            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
            add_header Pragma "no-cache" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
            # Make the bug-class "SW from a previous build keeps
            # intercepting" easy to reset — the kill switch in
            # index.html unregisters any SW it finds, but if the SW
            # was install-cached this header keeps it from being.
            add_header Service-Worker-Allowed "/" always;
        }
    }
}
